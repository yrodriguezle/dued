# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL (Self-signed certificate)
    ssl_certificate /etc/ssl/duedgusto/fullchain.pem;
    ssl_certificate_key /etc/ssl/duedgusto/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Frontend: React SPA
    root /opt/duedgusto/frontend/dist;
    index index.html;

    # index.html e config.json: mai cacheare
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /config.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Media della vetrina: serviti da nginx, non da .NET.
    # Deve stare PRIMA di "location /", altrimenti try_files restituirebbe index.html al posto
    # di un'immagine mancante e il browser mostrerebbe una pagina HTML dentro un <img>.
    # I file non vengono mai sovrascritti (una modifica produce una chiave nuova), quindi
    # "immutable" per un anno è sicuro.
    location /media/ {
        alias /opt/duedgusto/media/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache for hashed assets (Vite) - nome file cambia ad ogni build
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Upload dei media: location DEDICATA, con il solo limite di corpo innalzato.
    # 🔴 Non si allarga il limite di "location /api/": applicherebbe 24M anche a
    # /api/auth/signin, che è anonimo e rate-limitato.
    # 24M > 22 MB del [RequestSizeLimit] di MediaController > 20 MB di MediaLimiti.MaxByteFile:
    # i limiti stanno in ordine decrescente dall'esterno verso l'interno, così a rifiutare è
    # sempre lo strato che sa dire perché, e mai nginx con un 413 nudo. Il margine copre
    # l'overhead della codifica multipart.
    location /api/media {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_request_buffering on;
        client_max_body_size 24M;
    }

    # Backend: REST API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    # Backend: GraphQL + WebSocket
    location /graphql {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
        client_max_body_size 10M;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/duedgusto-access.log;
    error_log /var/log/nginx/duedgusto-error.log;
}

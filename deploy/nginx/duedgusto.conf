# ═════════════════════════════════════════════════════════════════════════════════════
# DuedGusto — due siti su un solo VPS.
#
#   duedgusto.it / www.duedgusto.it  →  la VETRINA (Astro SSR, container su :4321)
#   app.duedgusto.it  e  l'IP nudo   →  il GESTIONALE (SPA React + API + GraphQL)
#
# 🔴 IL BLOCCO DI DEFAULT NON E' UN RIPIEGO, E' LA RETE DI SICUREZZA.
#    Oggi il gestionale si raggiunge SOLO per IP, perche' deploy.sh scrive l'IP dentro
#    config.json. Finche' quel cablaggio esiste, un server block che rispondesse solo a
#    "app.duedgusto.it" lascerebbe la cassa irraggiungibile — cioe' il negozio fermo.
#    Il default_server serve percio' esattamente cio' che serviva prima, e continua a
#    farlo anche il giorno in cui il DNS punta qui.
#
# ⚠️ ORDINE: nginx sceglie il server block per Host esatto; solo se nessuno corrisponde
#    usa il default_server. La vetrina nomina i suoi due host e basta, quindi un Host
#    sconosciuto (o l'IP) NON puo' finire sulla vetrina per sbaglio.
# ═════════════════════════════════════════════════════════════════════════════════════

# Micro-cache della vetrina. Sessanta secondi: abbastanza da assorbire una raffica di
# visite, poco da rendere la modifica di un prezzo un mistero per l'amministratore.
#
# 🔴 NON si aggiunge "proxy_ignore_headers Cache-Control". E' quella riga a rendere
#    sicuro tutto il resto: il sito manda "no-store" sulle risposte DEGRADATE, e nginx
#    per default lo rispetta e non le mette in cache. Ignorando l'header si
#    congelerebbe la pagina rotta per un minuto DOPO che il backend e' tornato su — il
#    guasto durerebbe piu' del guasto.
proxy_cache_path /var/cache/nginx/vetrina levels=1:2 keys_zone=vetrina:10m
                 max_size=256m inactive=10m use_temp_path=off;

# ── HTTP :80 — sfida ACME e reindirizzamento ────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 🔴 DEVE stare PRIMA del redirect. Certbot in modalita' webroot scrive qui e poi
    #    Let's Encrypt legge in HTTP: con il solo "return 301" la sfida verrebbe
    #    rimbalzata su HTTPS, dove il certificato ancora non esiste — e il rinnovo
    #    fallirebbe ogni sessanta giorni, in silenzio, dopo mesi che tutto funziona.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ═════════════════════════════════════════════════════════════════════════════════════
# GESTIONALE — default_server: risponde all'IP, ad app.duedgusto.it e a qualunque Host
# non nominato altrove. E' il blocco che c'era prima di questa change, invariato nella
# sostanza: cambia solo l'aggiunta di server_name e i commenti.
# ═════════════════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name app.duedgusto.it _;

    ssl_certificate /etc/ssl/duedgusto/fullchain.pem;
    ssl_certificate_key /etc/ssl/duedgusto/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Frontend: React SPA
    root /opt/duedgusto/frontend/dist;
    index index.html;

    # index.html e config.json: mai cacheare
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /config.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Media della vetrina: serviti da nginx, non da .NET.
    # Deve stare PRIMA di "location /", altrimenti try_files restituirebbe index.html al posto
    # di un'immagine mancante e il browser mostrerebbe una pagina HTML dentro un <img>.
    # I file non vengono mai sovrascritti (una modifica produce una chiave nuova), quindi
    # "immutable" per un anno è sicuro.
    location /media/ {
        alias /opt/duedgusto/media/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache for hashed assets (Vite) - nome file cambia ad ogni build
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Upload dei media: location DEDICATA, con il solo limite di corpo innalzato.
    # 🔴 Non si allarga il limite di "location /api/": applicherebbe 24M anche a
    # /api/auth/signin, che è anonimo e rate-limitato.
    # 24M > 22 MB del [RequestSizeLimit] di MediaController > 20 MB di MediaLimiti.MaxByteFile:
    # i limiti stanno in ordine decrescente dall'esterno verso l'interno, così a rifiutare è
    # sempre lo strato che sa dire perché, e mai nginx con un 413 nudo. Il margine copre
    # l'overhead della codifica multipart.
    location /api/media {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_request_buffering on;
        client_max_body_size 24M;
    }

    # Backend: REST API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    # Backend: GraphQL + WebSocket
    location /graphql {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
        client_max_body_size 10M;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/duedgusto-access.log;
    error_log /var/log/nginx/duedgusto-error.log;
}

# ═════════════════════════════════════════════════════════════════════════════════════
# VETRINA — solo per i due host nominati. Tutto il resto cade sul default qui sopra.
# ═════════════════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name duedgusto.it www.duedgusto.it;

    ssl_certificate /etc/ssl/duedgusto/fullchain.pem;
    ssl_certificate_key /etc/ssl/duedgusto/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # www → apice. Una sola forma canonica, decisa qui e non nei meta della pagina:
    # PUBLIC_MEDIA_ORIGINE e' costruita con l'apice, e due host che servono lo stesso
    # contenuto sono due indirizzi da far coincidere a mano per sempre.
    if ($host = www.duedgusto.it) {
        return 301 https://duedgusto.it$request_uri;
    }

    # I media, dallo stesso host della vetrina: e' il motivo per cui
    # PUBLIC_MEDIA_ORIGINE vale "https://duedgusto.it" e non l'host del backend.
    # Stessa radice del blocco del gestionale: un solo posto su disco, due porte d'ingresso.
    location /media/ {
        alias /opt/duedgusto/media/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Le tre rotte pubbliche, e SOLO quelle, sullo stesso origin del sito.
    #
    # Il server Astro NON passa di qui: legge il backend sulla rete interna di Docker. Questa
    # location serve al BROWSER. Oggi nessuna isola la chiama — il sito e' SSR puro — ma senza
    # di essa la dottrina del progetto ("vetrina e API sullo stesso origin, quindi CORS non
    # entra mai in gioco", scritta in backend/Common/CorsOriginPolicy.cs) sarebbe semplicemente
    # falsa: verificata il 12 agosto 2026, GET https://duedgusto.it/api/public/galleria
    # rispondeva 404 servito da Astro, mentre sull'host del gestionale rispondeva 200.
    # La prima funzione client-side — il modulo prenotazioni, gia' predisposto nel modello con
    # PrenotazioniAttive e TurnstileSiteKey — avrebbe scoperto quel 404 in produzione.
    #
    # 🔴 Solo /api/public/, mai tutto /api/. Su un dominio di marketing non ha alcuna ragione
    #    di esistere /api/auth/signin, che e' anonimo e rate-limitato, ne' /graphql, che e' la
    #    corsia del privato. Il confine fra le due corsie e' il punto di tutta la Fase 2.
    location /api/public/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        client_max_body_size 1M;
        # Nessun proxy_cache: le tre rotte dichiarano gia' il proprio Cache-Control
        # (max-age=300), e il browser lo rispetta senza che nginx debba interporsi.
    }

    # Asset del bundle Astro: nome con hash, quindi immutabili.
    location /_astro/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache vetrina;
        proxy_cache_valid 200 1y;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        client_max_body_size 1M;

        proxy_cache vetrina;
        # Vale solo per le risposte che NON dichiarano un Cache-Control proprio.
        # Le degradate lo dichiarano ("no-store") e restano fuori dalla cache.
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        # Se il container del sito e' giu' o sta ripartendo, si serve la copia vecchia
        # invece di un 502: durante un deploy il visitatore non vede l'errore.
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/vetrina-access.log;
    error_log /var/log/nginx/vetrina-error.log;
}

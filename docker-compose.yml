services:
  mysql:
    image: mysql:8.0
    container_name: duedgusto-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-duedgusto}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - duedgusto-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: duedgusto-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CONNECTION_STRING: "server=mysql;database=${MYSQL_DATABASE:-duedgusto};user=root;password=${MYSQL_ROOT_PASSWORD}"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      # Radice dei media caricati dalla libreria del sito. Fuori da frontend/dist di
      # proposito: quella cartella viene svuotata a ogni deploy.
      MEDIA_ROOT: /app/media
      # Host cross-origin autorizzati (separati da virgola, solo host).
      # In produzione nginx serve app e API sullo stesso origin: serve per l'accesso
      # da app.duedgusto.it. La vetrina NON va aggiunta qui — nginx la serve sullo stesso
      # origin dell'API, quindi le sue richieste non sono cross-origin.
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-app.duedgusto.it}"
      SERVER_IP: "${SERVER_IP:-}"
      SEED_ON_STARTUP: "${SEED_ON_STARTUP:-true}"
      # Import una-tantum dello storico chiusure 2026: vuoto = OFF.
      # Si abilita temporaneamente nel .env del server (dryrun|1) e si rimuove dopo l'uso.
      SEED_REGISTRI_STORICI: "${SEED_REGISTRI_STORICI:-}"
      # Completa anche i giorni rimasti aperti e senza movimenti, invece di saltarli
      SEED_REGISTRI_STORICI_SOSTITUISCI_INCOMPLETI: "${SEED_REGISTRI_STORICI_SOSTITUISCI_INCOMPLETI:-}"
    volumes:
      # I media vivono sull'host e sopravvivono a ricostruzioni e deploy del container.
      # La directory è creata e assegnata a 10001:10001 dagli script di deploy.
      - /opt/duedgusto/media:/app/media
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - duedgusto-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Sito vetrina pubblico (Astro SSR, adapter Node standalone).
  #
  # 🔴 I DUE PREFISSI SONO ARGOMENTI DI BUILD, NON VARIABILI D'AMBIENTE. `astro:env` li
  #    inlina nel bundle: metterli sotto `environment:` non darebbe alcun errore e non
  #    avrebbe alcun effetto — il sito continuerebbe a servire i valori con cui e' stato
  #    costruito. Chi cambia uno di questi due valori DEVE ricostruire l'immagine.
  #    (sito/Dockerfile lo spiega per esteso; astro.config.mjs e' la fonte.)
  sito:
    build:
      context: ./sito
      dockerfile: Dockerfile
      args:
        # Il SERVER Astro legge le tre rotte pubbliche sulla rete interna di Docker.
        # Non passa da nginx e non esce dall'host: e' il backend, per nome di servizio.
        API_INTERNA_URL: "http://backend:5000"
        # Il BROWSER del visitatore scarica le foto da qui. Deve essere l'host PUBBLICO
        # del sito, con https: finisce dentro src/srcset e dentro og:image.
        # Nessun default: un valore inventato qui sarebbe indistinguibile da uno scelto,
        # e il Dockerfile si ferma con un messaggio che dice quale argomento manca.
        PUBLIC_MEDIA_ORIGINE: "${SITO_ORIGINE_PUBBLICA}"
    container_name: duedgusto-sito
    restart: unless-stopped
    # `depends_on` senza condizione: ordina l'avvio e basta. Non si aspetta il backend in
    # salute, perche' il sito e' progettato per degradare — `/` risponde 200 con marca,
    # slogan e orari anche se l'API non risponde. Legarlo a un health check
    # trasformerebbe una degradazione voluta in un container che non parte.
    depends_on:
      - backend
    ports:
      - "127.0.0.1:4321:4321"
    networks:
      - duedgusto-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  mysql_data:

networks:
  duedgusto-net:
    driver: bridge
